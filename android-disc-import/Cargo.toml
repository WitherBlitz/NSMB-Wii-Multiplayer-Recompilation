[package]
name = "nsmbw-disc-import"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "disc_import"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
# Pin to a reviewed revision for reproducible builds; accepts ISO/WBFS/RVZ.
nod = { git = "https://github.com/encounter/nod", rev = "ebd80cac99b48a323200d84365e07a58cc27412d", default-features = false, features = ["compress-bzip2-static", "compress-lzma-static", "compress-zlib-static", "compress-zstd-static"] }
